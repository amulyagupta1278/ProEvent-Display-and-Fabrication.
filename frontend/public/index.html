<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>EventXpertz | Exhibition, Corporate & Event Management Company in India</title>
    <meta
    name="description"
    content="EventXpertz is a professional exhibition and event management company in India, specializing in booth design, corporate events, branding, logistics, and end-to-end event solutions."/>

    <meta property="og:title" content="EventXpertz | Exhibition & Corporate Event Management Company" />
    <meta property="og:description" content="EventXpertz provides professional exhibition booths, corporate events, branding, and end-to-end event solutions across India." />
    <meta property="og:url" content="https://eventxpertz.in" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://eventxpertz.in/og-image.jpg" />

    <script type="application/ld+json">

    </script>
    



    <!-- Security (works on Netlify) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src  'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src   'self' https://fonts.gstatic.com;
        img-src    'self' data: https:;
        frame-src  https://docs.google.com https://www.google.com;
        connect-src 'self';
        media-src  'self' https:;
        upgrade-insecure-requests;
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- React mounts here -->
    <div id="root"></div>

    <!--
      Netlify Forms: hidden static form so Netlify detects it at build time.
      Keep the "contact" name in sync with your React form (LandingPage.jsx).
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="botField" hidden>
      <input type="text"   name="name" />
      <input type="email"  name="email" />
      <input type="text"   name="company" />
      <input type="text"   name="service" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>

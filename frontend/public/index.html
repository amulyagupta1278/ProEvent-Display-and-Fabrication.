      "mainEntity": [
        {
          "@type": "Question",
          "name": "Which cities and venues do you operate in?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We operate pan-India — Delhi NCR (Pragati Maidan, IEML), Mumbai (Bombay Exhibition Centre), Bengaluru (BIEC), Hyderabad (Hitex), Pune, Ahmedabad, Chennai, Kolkata, Jaipur, Noida, and Gurgaon."
          }
        },
        {
          "@type": "Question",
          "name": "What is the minimum booking lead time?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "2–3 weeks is ideal for a planned setup. For urgent requirements, we can mobilise within 48 hours subject to material availability."
          }
        },
        {
          "@type": "Question",
          "name": "Do you build both Octonorm and custom wooden stalls?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We fabricate modular Octonorm stalls and fully custom wooden or PVC builds. The choice depends on your budget, show duration, and brand guidelines."
          }
        },
        {
          "@type": "Question",
          "name": "What does end-to-end exhibition management include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Design, fabrication, branding and print, AV and LED setup, furniture, manpower, on-site supervision during the show, and complete post-event dismantling."
          }
        },
        {
          "@type": "Question",
          "name": "Do you provide a quotation before booking?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Share your stall size, city, show dates, and requirements — we provide a detailed quotation within 24 hours. No commitment needed to get a quote."
          }
        }
      ]
    }
